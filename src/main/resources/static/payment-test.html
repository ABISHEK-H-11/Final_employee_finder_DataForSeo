<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Razorpay Test Payment</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 60px auto;
            padding: 20px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            white-space: pre-wrap;
            background: #f5f5f5;
        }
    </style>
</head>

<body>

<h2>Employee Finder - Test Payment</h2>

<h3>Login</h3>

<input
        type="email"
        id="email"
        placeholder="Email"
        value="test@example.com">

<input
        type="password"
        id="password"
        placeholder="Password">

<button onclick="login()">Login</button>

<hr>

<h3>Payment</h3>

<button onclick="createOrder()">
    Pay ₹600
</button>

<div id="result"></div>

<script>

    let orderData = null;

    async function login() {

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {

            const response = await fetch(
                "/api/auth/login",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

            const result = await response.text();

            document.getElementById("result").innerText =
                "Login response:\n" + result;

        } catch (error) {

            document.getElementById("result").innerText =
                "Login error:\n" + error;
        }
    }


    async function createOrder() {

        try {

            const response = await fetch(
                "/api/payment/create-order",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({
                        plan: "STANDARD"
                    })
                }
            );

            if (!response.ok) {

                const error = await response.text();

                document.getElementById("result").innerText =
                    "Order creation failed:\n" + error;

                return;
            }

            orderData = await response.json();

            document.getElementById("result").innerText =
                "Order created:\n" +
                JSON.stringify(orderData, null, 2);

            openRazorpayCheckout();

        } catch (error) {

            document.getElementById("result").innerText =
                "Error:\n" + error;
        }
    }


    function openRazorpayCheckout() {

        const options = {

            key: orderData.keyId,

            amount: orderData.amount,

            currency: orderData.currency,

            name: "Employee Finder",

            description: "STANDARD Subscription",

            order_id: orderData.orderId,

            handler: async function (response) {

                console.log("Razorpay response:", response);

                document.getElementById("result").innerText =
                    "Payment successful!\n\n" +
                    "Order ID: " +
                    response.razorpay_order_id +
                    "\n\nPayment ID: " +
                    response.razorpay_payment_id +
                    "\n\nSignature: " +
                    response.razorpay_signature;

                await verifyPayment(response);
            },

            prefill: {
                email: document.getElementById("email").value
            },

            theme: {
                color: "#3399cc"
            }
        };

        const razorpay = new Razorpay(options);

        razorpay.on("payment.failed", function (response) {

            document.getElementById("result").innerText =
                "Payment failed:\n" +
                JSON.stringify(response.error, null, 2);
        });

        razorpay.open();
    }


    async function verifyPayment(response) {

        try {

            const verifyResponse = await fetch(
                "/api/payment/verify",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({

                        razorpayOrderId:
                        response.razorpay_order_id,

                        razorpayPaymentId:
                        response.razorpay_payment_id,

                        razorpaySignature:
                        response.razorpay_signature
                    })
                }
            );

            const result = await verifyResponse.text();

            document.getElementById("result").innerText +=
                "\n\nVerification response:\n" + result;

        } catch (error) {

            document.getElementById("result").innerText +=
                "\n\nVerification error:\n" + error;
        }
    }

</script>

</body>
</html>
